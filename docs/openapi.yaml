openapi: 3.0.3
info:
  title: CrisisDesk AI API
  version: 1.0.0
  description: Emergency and public-service report triage API with manager auth, LLM
    triage, duplicate detection, priority scoring, and analytics.
paths:
  /api/v1/auth/login:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagerLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagerLoginRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerLoginResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerLogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagerLogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagerLogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerProfile'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagerTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagerTokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerTokenRefreshResponse'
          description: ''
  /api/v1/reports:
    get:
      operationId: reports_list
      tags:
      - reports
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportList'
          description: ''
    post:
      operationId: reports_create
      tags:
      - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
          description: ''
  /api/v1/reports/{report_id}:
    get:
      operationId: reports_retrieve
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reports
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: ''
    delete:
      operationId: reports_delete
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reports
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/reports/{report_id}/status:
    patch:
      operationId: reports_status_update
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReportStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReportStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReportStatusUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: ''
  /api/v1/reports/stats/summary:
    get:
      operationId: reports_stats_summary
      tags:
      - reports
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStatsSummary'
          description: ''
components:
  schemas:
    AiStatusEnum:
      enum:
      - pending
      - completed
      - fallback
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `fallback` - Fallback
        * `failed` - Failed
    CategoryEnum:
      enum:
      - medical
      - fire
      - accident
      - crime
      - flood
      - utility
      - public_service
      - infrastructure
      - other
      type: string
      description: |-
        * `medical` - Medical
        * `fire` - Fire
        * `accident` - Accident
        * `crime` - Crime
        * `flood` - Flood
        * `utility` - Utility
        * `public_service` - Public Service
        * `infrastructure` - Infrastructure
        * `other` - Other
    DetectedLanguageEnum:
      enum:
      - en
      - bn
      - unknown
      type: string
      description: |-
        * `en` - English
        * `bn` - Bangla
        * `unknown` - Unknown
    DuplicateDetectionStatusEnum:
      enum:
      - pending
      - completed
      - fallback
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `fallback` - Fallback
        * `failed` - Failed
    ManagerLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    ManagerLoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/ManagerProfile'
      required:
      - access
      - refresh
      - user
    ManagerLogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    ManagerProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_staff:
          type: boolean
      required:
      - email
      - first_name
      - id
      - is_staff
      - last_name
      - username
    ManagerTokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    ManagerTokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    PatchedReportStatusUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
    ReportCreateRequest:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          minLength: 1
        language:
          allOf:
          - $ref: '#/components/schemas/DetectedLanguageEnum'
          default: unknown
        name:
          type: string
          maxLength: 255
        contact:
          type: string
          maxLength: 50
      required:
      - description
      - location
    ReportCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        summary:
          type: string
        suggestedAction:
          type: string
        confidence:
          type: number
          format: double
          maximum: 1
          minimum: 0
        features: {}
        detectedLanguage:
          type: string
        aiStatus:
          type: string
        possibleDuplicate:
          type: boolean
        matchedReportId:
          type: string
          nullable: true
          readOnly: true
        duplicateCount:
          type: integer
        similarityScore:
          type: number
          format: double
        priorityScore:
          type: integer
        duplicateDetectionStatus:
          type: string
        duplicateDetectionMethod:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - aiStatus
      - detectedLanguage
      - duplicateCount
      - duplicateDetectionMethod
      - duplicateDetectionStatus
      - id
      - matchedReportId
      - possibleDuplicate
      - priorityScore
      - similarityScore
      - suggestedAction
    ReportDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reporter_name:
          type: string
          maxLength: 255
        reporter_contact:
          type: string
          maxLength: 50
        description:
          type: string
        location:
          type: string
          maxLength: 500
        submitted_language:
          $ref: '#/components/schemas/DetectedLanguageEnum'
        detected_language:
          $ref: '#/components/schemas/DetectedLanguageEnum'
        category:
          $ref: '#/components/schemas/CategoryEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        summary:
          type: string
        suggested_action:
          type: string
        confidence:
          type: number
          format: double
          maximum: 1
          minimum: 0
        features: {}
        ai_status:
          $ref: '#/components/schemas/AiStatusEnum'
        possible_duplicate:
          type: boolean
        matched_report:
          type: string
          format: uuid
          nullable: true
        similarity_score:
          type: number
          format: double
          maximum: 1
          minimum: 0
          nullable: true
        duplicate_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        duplicate_group_key:
          type: string
          format: uuid
          nullable: true
        duplicate_detection_status:
          $ref: '#/components/schemas/DuplicateDetectionStatusEnum'
        priority_score:
          type: integer
          maximum: 100
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - location
      - updated_at
    ReportList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        summary:
          type: string
        priority_score:
          type: integer
          maximum: 100
          minimum: 0
        possible_duplicate:
          type: boolean
        duplicate_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ReportStatsSummary:
      type: object
      properties:
        totalReports:
          type: integer
        criticalReports:
          type: integer
        pendingReports:
          type: integer
        resolvedReports:
          type: integer
        categoryBreakdown:
          type: object
          additionalProperties:
            type: integer
        urgencyBreakdown:
          type: object
          additionalProperties:
            type: integer
      required:
      - categoryBreakdown
      - criticalReports
      - pendingReports
      - resolvedReports
      - totalReports
      - urgencyBreakdown
    StatusEnum:
      enum:
      - pending
      - in_review
      - assigned
      - resolved
      - rejected
      - marked_spam
      type: string
      description: |-
        * `pending` - Pending
        * `in_review` - In Review
        * `assigned` - Assigned
        * `resolved` - Resolved
        * `rejected` - Rejected
        * `marked_spam` - Marked as Spam
    UrgencyEnum:
      enum:
      - low
      - medium
      - high
      - critical
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
        * `critical` - Critical
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
